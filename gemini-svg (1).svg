<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 90" width="300" height="90">
  <defs>
    <!-- Metallic Red Bevel Gradient -->
    <linearGradient id="red-metal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff6b81"/>
      <stop offset="25%" stop-color="#d63031"/>
      <stop offset="60%" stop-color="#800e13"/>
      <stop offset="100%" stop-color="#3a0007"/>
    </linearGradient>

    <!-- Outer Frame Gradient -->
    <linearGradient id="frame-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff7675"/>
      <stop offset="100%" stop-color="#2d3436"/>
    </linearGradient>

    <!-- Outer Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Button Base / Shadow -->
  <rect x="5" y="10" width="290" height="75" rx="14" fill="#090305"/>

  <!-- Main Body Frame -->
  <rect x="5" y="5" width="290" height="75" rx="14" fill="#18070a" stroke="url(#frame-grad)" stroke-width="3" filter="url(#glow)"/>

  <!-- Inner Metallic Face -->
  <rect x="12" y="12" width="276" height="61" rx="10" fill="url(#red-metal)" stroke="#ff2a55" stroke-width="1.5"/>

  <!-- Text -->
  <text x="150" y="52" fill="#ffffff" font-family="'Arial Black', 'Impact', sans-serif" font-size="34" font-weight="900" text-anchor="middle" letter-spacing="4" style="text-shadow: 0px 2px 4px #000;">QUIT</text>
</svg>
